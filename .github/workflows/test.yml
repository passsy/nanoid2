name: Dart CI

on: [push, pull_request]

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    container:
      image: dart:stable

    steps:
      - uses: actions/checkout@v2
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test

  format:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    container:
      image: dart:stable

    steps:
      - uses: actions/checkout@v2
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .

  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    container:
      image: dart:stable

    steps:
      - uses: actions/checkout@v2
      - name: Dart version
        run: dart --version
      - name: Install dependencies
        run: dart pub get
      - name: analyze
        run: dart analyze --fatal-infos .
